[project]
name = "parts-inventory"
version = "0.1.0"
description = "Vision-driven inventory of MCU tools and components, readable by Claude Code"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.137.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
    "sqlite-vec>=0.1.9",
    "uvicorn>=0.49.0",
]

[project.scripts]
parts-inventory = "parts_inventory.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16",
    "ty>=0.0.84",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
