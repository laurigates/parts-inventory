[project]
name = "parts-inventory"
version = "0.1.0"
description = "Vision-driven inventory of MCU tools and components, readable by Claude Code"
requires-python = ">=3.13"
dependencies = [
    "sqlite-vec>=0.1.9",
]

[project.scripts]
parts-inventory = "parts_inventory.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
